name: Validate delivery assets

on:
  pull_request:
    paths:
      - 'app/**'
      - 'helm/**'
      - 'gitops/**'
      - 'argocd/**'
      - '.github/workflows/validate.yml'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'helm/**'
      - 'gitops/**'
      - 'argocd/**'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint Helm chart
        run: helm lint helm/platform-app
      - name: Render Helm chart
        run: helm template platform-app helm/platform-app --namespace platform-demo
      - name: Validate Docker build context
        run: docker build --check app
