server {
    listen 8080;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location = /health {
        access_log off;
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }

    location = /ready {
        access_log off;
        return 200 'ready\n';
        add_header Content-Type text/plain;
    }
}
